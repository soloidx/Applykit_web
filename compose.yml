services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: applykit
      POSTGRES_USER: applykit
      POSTGRES_PASSWORD: applykit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applykit -d applykit"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: docker-development-only-key
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      DATABASE_URL: postgres://applykit:applykit@db:5432/applykit
    command: ["uv", "run", "python", "manage.py", "runserver", "0.0.0.0:8000"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
