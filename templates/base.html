{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="ApplyKit keeps your job search focused.">
    <title>{% block title %}ApplyKit{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <script src="https://unpkg.com/htmx.org@2.0.6/dist/htmx.min.js" integrity="sha384-Akqfrbj/HpNVo8k11SXBb6TlBWmXXlYQrCSqEWmyKJe+hDm3Z/B2WVG4smwBkRVm" crossorigin="anonymous"></script>
  </head>
  <body class="min-h-screen bg-sand text-ink">
    <header class="border-b border-ink/10 bg-sand/90">
      <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-5" aria-label="Main navigation">
        <a class="font-display text-2xl font-semibold tracking-tight" href="{% url 'home' %}">ApplyKit<span class="text-coral">.</span></a>
        <span class="hidden text-sm text-ink/60 sm:block">A calmer way to move your search forward.</span>
      </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
