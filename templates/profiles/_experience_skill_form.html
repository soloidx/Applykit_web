<div id="experience-skill-form-{{ experience.pk }}">
  <form method="post" action="{% url 'experience_skill_create' experience.pk %}" class="flex flex-col gap-3 sm:flex-row sm:items-end" hx-post="{% url 'experience_skill_create' experience.pk %}" hx-target="#experience-skill-form-{{ experience.pk }}" hx-swap="outerHTML">
    {% csrf_token %}
    <div class="min-w-0 flex-1">
      <label class="text-sm font-semibold text-ink" for="{{ experience_skill_form.label.id_for_label }}-{{ experience.pk }}">Add experience hard skill</label>
      <input class="mt-2 block w-full rounded-2xl border border-ink/15 bg-sand px-4 py-3 text-ink outline-none transition placeholder:text-ink/35 focus:border-coral focus:ring-2 focus:ring-coral/20" id="{{ experience_skill_form.label.id_for_label }}-{{ experience.pk }}" name="label" type="text" value="{% if experience_skill_experience and experience_skill_experience.pk == experience.pk %}{{ experience_skill_form.label.value|default:'' }}{% endif %}">
      {% if experience_skill_experience and experience_skill_experience.pk == experience.pk %}{% for error in experience_skill_form.label.errors %}<p class="mt-2 text-sm text-coral" role="alert">{{ error }}</p>{% endfor %}{% endif %}
    </div>
    <button class="rounded-full bg-ink px-5 py-3 text-sm font-semibold text-sand transition hover:bg-coral" type="submit">Add skill</button>
  </form>
</div>
