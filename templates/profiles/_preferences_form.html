<div id="preferences-form">
  <div class="flex items-center justify-between gap-4">
    <h3 class="font-display text-2xl font-semibold">Presentation preferences</h3>
  </div>
  <form method="post" action="{% url 'presentation_preferences' %}" class="mt-5 space-y-6" hx-post="{% url 'presentation_preferences' %}" hx-target="#preferences-form" hx-swap="outerHTML">
    {% csrf_token %}
    {% if presentation_preferences_form.non_field_errors %}<div class="rounded-2xl bg-coral/10 px-4 py-3 text-sm text-coral" role="alert">{{ presentation_preferences_form.non_field_errors }}</div>{% endif %}
    <div class="grid gap-4 sm:grid-cols-2">
      {% for field in presentation_preferences_form %}
      <label class="flex items-center gap-3 rounded-2xl border border-ink/10 bg-sand/60 px-4 py-3 text-sm font-semibold text-ink">
        {{ field }}
        <span>{{ field.label }}</span>
      </label>
      {% endfor %}
    </div>
    <button class="rounded-full bg-ink px-6 py-3 text-sm font-semibold text-sand transition hover:bg-coral" type="submit">Save preferences</button>
  </form>
</div>
