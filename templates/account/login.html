{% extends "base.html" %}

{% block title %}Sign in | ApplyKit{% endblock %}

{% block content %}
<section class="mx-auto max-w-lg px-6 py-20">
  <div class="rounded-[2rem] border border-ink/10 bg-cream p-8 shadow-[0_24px_80px_rgba(41,38,33,0.08)] sm:p-10">
    <p class="text-sm font-semibold uppercase tracking-[0.22em] text-coral">Welcome back</p>
    <h1 class="mt-3 font-display text-4xl font-semibold">Sign in to ApplyKit</h1>
    <form class="mt-8 space-y-5" method="post" action="{% url 'account_login' %}">
      {% csrf_token %}
      {{ form.as_p }}
      {% if redirect_field_value %}<input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">{% endif %}
      <button class="w-full rounded-full bg-ink px-6 py-3 text-sm font-semibold text-sand transition hover:bg-coral" type="submit">Sign in</button>
    </form>
    <p class="mt-6 text-sm text-ink/60">New here? <a class="font-semibold text-coral" href="{% url 'account_signup' %}">Create your workspace</a></p>
  </div>
</section>
{% endblock %}
