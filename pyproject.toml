[project]
name = "applykit"
version = "0.1.0"
description = "A private, server-rendered job-search assistant."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=5.2,<6.0",
    "django-allauth>=65.11,<66.0",
    "django-anymail[resend]>=13.1,<14.0",
    "django-environ>=0.12,<1.0",
    "gunicorn>=23.0,<24.0",
    "psycopg[binary]>=3.2,<4.0",
    "whitenoise>=6.9,<7.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.2,<6.0",
    "mypy>=1.17,<2.0",
    "pytest>=8.4,<9.0",
    "pytest-django>=4.11,<5.0",
    "pytest-playwright>=0.7,<1.0",
    "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests/unit", "tests/integration", "tests/browser"]
addopts = "-m 'not browser'"
markers = [
    "browser: tests that require a Playwright browser",
    "integration: tests requiring Django and database access",
    "unit: tests that do not require Django or database access",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["staticfiles", "uv.lock", "**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "config"]
